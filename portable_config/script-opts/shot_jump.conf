# Group review (shot_jump.lua).
# review_xml: the XML a review opens. In a folder of lettered rung folders it gets the
# four marks and Save; any other XML there is browse-only.
review_xml=review.xml
# The project's own scripts, each "path under the XML's folder, then arguments", run as
#   <review_runner> run --directory <xml folder> --script <path> <arguments>
# review_open_cmd rebuilds the XML before it loads. review_save_cmds (separated by ;)
# run after Save has written <shots>/selects.json: apply it to the folders, rebuild the XML.
# review_runner: uv's name or full path. mpv started from the Finder, Dock or Start menu has
# a short PATH, so it also tries the usual install folders; give the full path if uv is elsewhere.
review_runner=uv
review_open_cmd=.claude/skills/review/review_xml.py
review_save_cmds=.claude/skills/review/sync.py;.claude/skills/review/review_xml.py
# review_reviewers: under the XML's folder, {"logins": {login: name}}. Each shot's state and note
# are saved with the name of whoever set them (the login, lowercased, if it isn't listed).
review_reviewers=.claude/skills/reviewers.json
