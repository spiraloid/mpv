# Group review (shot_jump.lua).
# review_xml: the XML a review opens. In a folder of lettered rung folders it gets the
# four marks and Save; any other XML there is browse-only.
review_xml=review.xml
# The project's own scripts, each "path under the XML's folder, then arguments", run as
#   <review_runner> run --directory <xml folder> --script <path> <arguments>
# review_open_cmd rebuilds the XML before it loads. review_save_cmds (separated by ;)
# run after Save has written <shots>/selects.json: apply it to the folders, rebuild the XML.
review_runner=uv
review_open_cmd=.claude/skills/daily/daily.py --xml
review_save_cmds=.claude/skills/review/sync.py;.claude/skills/daily/daily.py --xml
