autoload-files=yes
# Single source of truth for media types: autoload-files and the scripts all read these lists.
# mpv's defaults already include jpg/png/tga/tiff/heic, mp4/mov/mkv/3gp/mpg, wav/aiff/flac/opus/mp3
image-exts-append=psd
audio-exts-append=aif
audio-exts-append=aifc
video-exts-append=mts
# Pass every wheel notch through. mpv's default preprocessing drops a scroll smaller than
# 0.125 unless more arrives within ~0.2s, which swallowed slow single notches (0.1 on macOS).
input-preprocess-wheel=no
loop-file=inf
fs=yes
image-display-duration=inf

# OSD settings - smaller text in bottom left, 33% opaque
osd-font-size=12
osd-align-x=left
osd-align-y=bottom
osd-margin-x=20
osd-margin-y=20
osd-color='#55FFFFFF'
osd-border-color='#55000000'

# macOS: instant fullscreen (no animated slide into a separate Space)
[macos]
profile-cond=platform == "darwin"
native-fs=no
