PGUP playlist-prev
PGDWN playlist-next
esc quit
# SPACE handled by smart_space binding in script
f cycle fullscreen
Shift+LEFT seek -5
Shift+RIGHT seek +5
# Previous / next shot (shot_jump.lua); frame step when a file has no known cuts
RIGHT script-binding shot_jump/shot_next
LEFT script-binding shot_jump/shot_prev
# Plain XML assembly (no rung folders): reject a clip (move it to retired) / restore it,
# and show/hide the label + buttons overlay. In a review (shot_jump.lua binds these itself
# while one is open): c / a / r / m mark the shot, x clears its choice, Ctrl+Shift+S saves.
r script-binding shot_jump/retire
u script-binding shot_jump/undo
o script-binding shot_jump/toggle_overlay
# UP / DOWN (copy_remove_attempt_suffix.lua): in an XML assembly, step through the history
# of the shot on screen: UP the next older version (up to the cleaned plate), DOWN the next
# newer (down to the final). LEFT / RIGHT move between shots.
Alt+enter cycle fullscreen
Ctrl+n script-binding browse_to_next_folder
Alt+s script-binding copy_remove_attempt_suffix