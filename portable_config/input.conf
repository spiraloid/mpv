PGUP playlist-prev
PGDWN playlist-next
esc quit
# SPACE handled by smart_space binding in script
f cycle fullscreen
Shift+LEFT seek -5
Shift+RIGHT seek +5
# Previous / next shot (shot_jump.lua); frame step when a file has no known cuts
RIGHT script-binding shot_jump/shot_next
LEFT script-binding shot_jump/shot_prev
# XML assembly: approve (copy to shots/K_final) / reject (move to retired; the slot
# falls back to the next file down the rungs) / un-retire the next newer version, and show/hide
# the label + buttons overlay
a script-binding shot_jump/approve
r script-binding shot_jump/retire
u script-binding shot_jump/undo
o script-binding shot_jump/toggle_overlay
# UP / DOWN (copy_remove_attempt_suffix.lua): in an XML assembly, a still of the next
# newer / older version of the shot on screen; play goes back to the edit
Alt+enter cycle fullscreen
Ctrl+n script-binding browse_to_next_folder
Alt+s script-binding copy_remove_attempt_suffix